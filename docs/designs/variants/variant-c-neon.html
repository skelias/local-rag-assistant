<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>变体 C · 霓虹夜航</title>
<style>
  :root{
    --bg:#07040d; --ink:#efe9ff; --dim:#8f84b8;
    --neon1:#22d3ee; --neon2:#a855f7; --neon3:#f472b6;
    --user:linear-gradient(135deg,#0e7490,#7c3aed);
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",sans-serif;
       height:100vh;display:flex;overflow:hidden}
  .glow{position:fixed;border-radius:50%;filter:blur(100px);z-index:0}
  .g1{width:50vw;height:50vh;left:-8vw;top:-12vh;background:rgba(34,211,238,.22)}
  .g2{width:45vw;height:45vh;right:-8vw;top:20vh;background:rgba(168,85,247,.25)}
  aside{width:248px;z-index:1;background:rgba(10,6,22,.72);backdrop-filter:blur(20px);
        border-right:1px solid rgba(168,85,247,.25);padding:16px;display:flex;flex-direction:column;gap:12px}
  .logo{font-weight:800;font-size:17px;background:linear-gradient(90deg,#22d3ee,#a855f7,#f472b6);
        -webkit-background-clip:text;background-clip:text;color:transparent}
  nav a{display:block;padding:9px 12px;border-radius:9px;color:var(--dim);font-size:14px;text-decoration:none;
        border:1px solid transparent}
  nav a.on{color:#fff;border-color:rgba(168,85,247,.5);background:rgba(168,85,247,.12);
           box-shadow:0 0 14px -4px rgba(168,85,247,.6)}
  .hist{color:var(--dim);font-size:12px}
  .hist div{padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.03);margin-top:6px;
            border-left:2px solid rgba(34,211,238,.5);font-size:13px;color:var(--ink)}
  main{flex:1;z-index:1;display:flex;flex-direction:column}
  .msgs{flex:1;overflow:auto;padding:26px 5vw;display:flex;flex-direction:column;gap:16px}
  .bub{max-width:min(680px,84%);padding:13px 17px;line-height:1.7;font-size:15px}
  .user{align-self:flex-end;background:var(--user);color:#fff;border-radius:20px 20px 4px 20px;
        box-shadow:0 0 26px -8px rgba(124,58,237,.8);border:1px solid rgba(255,255,255,.15)}
  .ai{align-self:flex-start;background:rgba(255,255,255,.045);border:1px solid rgba(168,85,247,.35);
      border-radius:4px 20px 20px 20px;box-shadow:inset 0 0 22px -12px rgba(34,211,238,.5)}
  .tag{display:inline-block;margin-top:7px;font-size:12px;color:#67e8f9;border:1px solid rgba(34,211,238,.55);
       background:rgba(34,211,238,.1);border-radius:99px;padding:1px 10px;cursor:pointer;
       box-shadow:0 0 10px -2px rgba(34,211,238,.6)}
  .bar{padding:16px 5vw 24px;z-index:2}
  .liquid{position:relative;border-radius:99px;padding:1.5px;background:conic-gradient(from 0deg,#22d3ee,#a855f7,#f472b6,#22d3ee);
          animation:spin 6s linear infinite}
  .inner{border-radius:99px;background:#0a0617;display:flex;align-items:center;gap:10px;padding:6px 8px 6px 20px}
  input{flex:1;background:none;border:0;outline:0;color:var(--ink);font-size:15px}
  .send{border:0;cursor:pointer;color:#04020a;font-weight:800;padding:10px 22px;border-radius:99px;
        background:linear-gradient(90deg,#22d3ee,#a855f7);box-shadow:0 0 18px -4px rgba(34,211,238,.9)}
  .chip{margin-top:10px;font-size:11px;color:var(--dim)}
  @keyframes spin{to{filter:hue-rotate(360deg)}}
</style>
</head>
<body>
  <div class="glow g1"></div><div class="glow g2"></div>
  <aside>
    <div class="logo">RAG AI 助手</div>
    <nav><a class="on">对话</a><a>知识库</a><a>Agent</a><a>设置</a></nav>
    <div class="hist">历史<div>FastAPI 用法</div><div>Qdrant 配置</div></div>
  </aside>
  <main>
    <div class="msgs">
      <div class="bub ai">变体 C · 霓虹夜航：深夜底 + 青紫霓虹描边与辉光，气泡带发光边，动感更强。</div>
      <div class="bub user">用户消息：带霓虹内光的渐变气泡。</div>
      <div class="bub ai">来源引用做成发光药丸 <span class="tag">[1] qdrant.md · 82%</span>；底部输入框是旋转渐变描边 + 发光发送钮。</div>
      <div class="chip">若选这个方向，辉光强度/配色浓度可再调。</div>
    </div>
    <div class="bar">
      <div class="liquid"><div class="inner"><input placeholder="输入问题…"><button class="send">发送</button></div></div>
    </div>
  </main>
</body>
</html>
